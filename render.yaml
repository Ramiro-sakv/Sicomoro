services:
  - type: web
    name: sicomoro
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Sicomoro.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ApplyMigrationsOnStartup
        value: "true"
      - key: Swagger__Enabled
        value: "false"
      - key: WhatsApp__Enabled
        value: "false"
      - key: Jwt__Issuer
        value: Sicomoro
      - key: Jwt__Key
        generateValue: true
      - key: UserRegistration__Clave
        sync: false
      - key: DATABASE_URL
        sync: false
